name: evora
description: "EVORA — AI-Powered Civic Intelligence and Citizen Sustainability Platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2
  flutter_dotenv: ^6.0.1
  geolocator: ^14.1.2
  image: ^4.12.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
